<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bureau Kandi Glaze — Accès privé</title>
<style>
:root{--bg:#fdf2f8;--card:#fff;--ink:#3b1d33;--muted:#8a6a80;--accent:#ec4899;--line:#f5d0e6}
@media (prefers-color-scheme:dark){:root{--bg:#1c1220;--card:#2a1b2f;--ink:#fbe7f3;--muted:#c9a8bd;--accent:#f472b6;--line:#4a3050}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(236,72,153,.12)}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
#err{color:#e11d48;font-size:14px;min-height:20px;margin-top:10px}
label.r{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:12px}
label.r input{width:auto}
</style></head><body>
<form id="f">
<h1>🍬 Bureau Kandi Glaze</h1>
<p>Accès privé. Entre le mot de passe pour ouvrir le bureau.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" autofocus required>
<label class="r"><input id="rem" type="checkbox"> Se souvenir sur cet appareil</label>
<button id="b" type="submit">Entrer</button>
<div id="err" role="alert"></div>
</form>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById("f"),b=document.getElementById("b"),e=document.getElementById("err");
let saved=null;try{saved=localStorage.getItem("kg_pw");}catch(_){}
if(saved){open_(saved).then(show).catch(()=>{try{localStorage.removeItem("kg_pw")}catch(_){}});}
f.addEventListener("submit",async ev=>{
  ev.preventDefault();e.textContent="";b.disabled=true;b.textContent="Ouverture…";
  const pw=document.getElementById("pw").value;
  try{const html=await open_(pw);
    if(document.getElementById("rem").checked){try{localStorage.setItem("kg_pw",pw)}catch(_){}}
    show(html);
  }catch(_){e.textContent="Mot de passe incorrect.";b.disabled=false;b.textContent="Entrer";}
});
</script></body></html>
